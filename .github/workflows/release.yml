name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build & Package Windows Installer
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:PATH += ";C:\Program Files (x86)\NSIS"
            echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          makensis /VERSION

      - name: Compile Release Binary
        shell: pwsh
        run: |
          cargo build --release -p aitoolplus

      - name: Package NSIS Installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/build-installer.ps1

      - name: Compute Checksum and Generate latest.json
        id: manifest
        shell: pwsh
        run: |
          $installerPath = "target/dist/aitoolplus-setup.exe"
          if (-not (Test-Path $installerPath)) {
            throw "Installer not found at $installerPath"
          }
          $hash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()
          $hash | Out-File -FilePath "target/dist/aitoolplus-setup.exe.sha256" -Encoding ascii

          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.tag }}" }
          $version = $tag.TrimStart('v')
          $pubDate = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          $repo = $env:GITHUB_REPOSITORY

          $latestManifest = @{
            version = $version
            notes = "AIToolPlus $tag release"
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                url = "https://github.com/$repo/releases/download/$tag/aitoolplus-setup.exe"
                sha256 = $hash
              }
            }
          } | ConvertTo-Json -Depth 5

          $latestManifest | Out-File -FilePath "target/dist/latest.json" -Encoding utf8
          Write-Host "Generated latest.json:"
          Get-Content "target/dist/latest.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: AIToolPlus ${{ github.ref_name || github.event.inputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/dist/aitoolplus-setup.exe
            target/dist/aitoolplus-setup.exe.sha256
            target/dist/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
