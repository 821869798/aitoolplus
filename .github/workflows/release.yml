name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.24)'
        required: true
        default: 'v0.1.24'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:PATH += ";C:\Program Files (x86)\NSIS"
            echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          makensis /VERSION

      - name: Compile Release Binary
        shell: pwsh
        run: cargo build --release -p aitoolplus

      - name: Package NSIS Installer and Portable Archive
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/build-installer.ps1 -SkipBuild
          Compress-Archive -Path target/release/aitoolplus.exe -DestinationPath target/dist/aitoolplus-windows-x86_64.zip -Force

          foreach ($file in @("target/dist/aitoolplus-setup.exe", "target/dist/aitoolplus-windows-x86_64.zip")) {
            if (-not (Test-Path $file)) { throw "Expected artifact not found: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            $hash | Out-File -FilePath "$file.sha256" -Encoding ascii
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            target/dist/aitoolplus-setup.exe
            target/dist/aitoolplus-setup.exe.sha256
            target/dist/aitoolplus-windows-x86_64.zip
            target/dist/aitoolplus-windows-x86_64.zip.sha256

  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-15
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64

      - name: Setup Sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Compile Release Binary
        run: cargo build --release -p aitoolplus --target aarch64-apple-darwin

      - name: Package macOS .app & .dmg
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          bash tools/package-macos.sh "$RELEASE_TAG" "target/aarch64-apple-darwin/release/aitoolplus"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-arm64
          path: |
            target/dist/aitoolplus-macos-arm64.dmg
            target/dist/aitoolplus-macos-arm64.dmg.sha256

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev \
            libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libzstd-dev libvulkan1

      - name: Compile Release Binary
        run: cargo build --release -p aitoolplus --target ${{ matrix.target }}

      - name: Package Linux .tar.gz & .deb
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          bash tools/package-linux.sh "${{ matrix.arch }}" "$RELEASE_TAG" "target/${{ matrix.target }}/release/aitoolplus"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.tar.gz.sha256
            target/dist/*.deb
            target/dist/*.deb.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos-arm64, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Unified latest.json
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, datetime, pathlib

          tag = os.environ["RELEASE_TAG"]
          version = tag.lstrip("v")
          repo = os.environ["GITHUB_REPOSITORY"]
          pub_date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          dist = pathlib.Path("dist")

          def read_sha(name: str) -> str:
              p = dist / f"{name}.sha256"
              return p.read_text().strip().split()[0].lower() if p.is_file() else ""

          platforms = {}
          mapping = {
              "windows-x86_64": "aitoolplus-setup.exe",
              "darwin-aarch64": "aitoolplus-macos-arm64.dmg",
              "linux-x86_64": "aitoolplus-linux-x86_64.tar.gz",
              "linux-aarch64": "aitoolplus-linux-aarch64.tar.gz",
          }
          for key, filename in mapping.items():
              if (dist / filename).is_file():
                  platforms[key] = {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{filename}",
                      "sha256": read_sha(filename),
                  }

          manifest = {
              "version": version,
              "notes": f"AIToolPlus {tag} release",
              "pub_date": pub_date,
              "platforms": platforms,
          }
          out = dist / "latest.json"
          out.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AIToolPlus ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
