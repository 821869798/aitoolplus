[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
repository = "https://github.com/821869798/aitoolplus"
authors = ["aitoolplus contributors"]

[workspace.dependencies]
aitoolplus-core = { path = "crates/aitoolplus-core" }
aitoolplus-ui = { path = "crates/aitoolplus-ui" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml_edit = "0.22"
sha2 = "0.10"
hmac = "0.12"

# GPUI Kit (crates.io, without gpui-shell)
gpui-kit = { version = "0.6.1", default-features = false, features = ["component", "assets"] }
async-channel = "2"
rfd = "0.15"
opener = { version = "0.8", features = ["reveal"] }
unicode-segmentation = "1.12"

[profile.dev.package.aitoolplus-ui]
opt-level = 1

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

