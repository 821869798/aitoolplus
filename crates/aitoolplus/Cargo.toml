[package]
name = "aitoolplus"
description = "AI programming assistant config workbench on GPUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aitoolplus"
path = "src/main.rs"

[dependencies]
aitoolplus-core.workspace = true
aitoolplus-ui.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
gpui-kit.workspace = true
async-channel.workspace = true
rfd.workspace = true
notify = "7"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }
muda = { version = "0.19", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }
muda = { version = "0.19", default-features = false, features = ["gtk"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
